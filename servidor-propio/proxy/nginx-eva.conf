# Equivalente a proxy/Caddyfile para quien ya tenga nginx delante.
# Mismas reglas: visor público acotado a tres rutas y a emalsa.es; editor
# solo para la red interna. Los certificados los gestiona certbot (o la CA
# de la empresa). No se ha podido probar en este entorno: validar con
# «nginx -t» y con pruebas/atacar.py antes de darlo por bueno.
#
# Si se usa este archivo, quitar el servicio «proxy» del docker-compose.yml y
# publicar editor y visor solo en la interfaz local:
#   typebot-builder: ports: ["127.0.0.1:8080:3000"]
#   typebot-viewer:  ports: ["127.0.0.1:8081:3000"]

# Orígenes que pueden hablar con el bot. Sin Origin (scripts) -> vacío -> 404.
map $http_origin $eva_origen_ok {
    default                 0;
    "https://emalsa.es"     1;
    "https://www.emalsa.es" 1;
}

# Red interna de la empresa: ajustar.
geo $eva_interna {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

server {
    listen 80;
    server_name asistente.emalsa.es eva-editor.emalsa.es;
    return 301 https://$host$request_uri;
}

# ── Visor ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name asistente.emalsa.es;
    ssl_certificate     /etc/letsencrypt/live/asistente.emalsa.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asistente.emalsa.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/eva-proxy-params.conf;
    }

    # Las tres rutas de la burbuja, solo desde emalsa.es (o desde la red interna).
    location ~ ^/api/v1/(typebots/eva/startChat|sessions/[^/]+/(continueChat|clientLogs))$ {
        if ($eva_interna = 0) { set $eva_permiso $eva_origen_ok; }
        if ($eva_interna = 1) { set $eva_permiso 1; }
        if ($eva_permiso != 1) { return 404; }
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/eva-proxy-params.conf;
    }

    # Red interna: visor completo (vista previa del editor).
    location / {
        if ($eva_interna = 0) { return 404; }
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/eva-proxy-params.conf;
    }
}

# ── Editor ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name eva-editor.emalsa.es;
    ssl_certificate     /etc/letsencrypt/live/eva-editor.emalsa.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eva-editor.emalsa.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        if ($eva_interna = 0) { return 403; }
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/eva-proxy-params.conf;
    }
}

