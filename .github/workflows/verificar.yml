name: Verificar seguridad

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      # Acción fijada por commit, no por etiqueta, para que no pueda cambiar sin aviso.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/verificar.py
      # Las pruebas contra el bot real (test_en_vivo.py) se saltan aquí: abren conversaciones reales.
      - run: python3 -m unittest discover -s tests -v
